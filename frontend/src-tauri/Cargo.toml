[package]
name = "pyjama"
version = "0.1.0"
description = "PyJama — Governed Local Data Workspace"
authors = ["PyJama"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pyjama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Phase 1 — Databricks read path
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
keyring = "2"
async-trait = "0.1"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# default Tauri custom-protocol flag for production bundles
custom-protocol = ["tauri/custom-protocol"]
